name: CI - Caching

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.10'
    outputs:
      pip-cache-hit:
        value: ${{ jobs.warm-pip-cache.outputs.cache-hit }}
      docker-cache-hit:
        value: ${{ jobs.warm-docker-cache.outputs.cache-hit }}

jobs:
  warm-pip-cache:
    runs-on: self-hosted
    outputs:
      cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip dependencies
      id: pip-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          pip-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Warm pip cache
      if: steps.pip-cache.outputs.cache-hit != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pylint

  warm-docker-cache:
    runs-on: self-hosted
    outputs:
      cache-hit: ${{ steps.docker-cache.outputs.cache-hit }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      id: docker-cache
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: docker-${{ runner.os }}-hypothesis-${{ hashFiles('docker/Dockerfile', '**/pyproject.toml') }}
        restore-keys: |
          docker-${{ runner.os }}-hypothesis-

    - name: Warm Docker build cache (main image)
      run: |
        docker buildx build \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          --file docker/Dockerfile \
          --tag hypothesis-cache-warm:latest \
          --load \
          . 2>/dev/null || true

        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true
        echo "[SUCCESS] Docker layer cache warmed"
